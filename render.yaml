services:
  # Main Dhanvantri application
  - type: web
    name: dhanvantri-app
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile.render
    envVars:
      - key: OLLAMA_BASE
        value: http://mock-ollama-service
      - key: WHISPER_BASE
        value: http://localhost:5001
      - key: LOG_LEVEL
        value: INFO
      - key: ENABLE_PRODUCTION_FEATURES
        value: false
      - key: MAX_CONCURRENT_REQUESTS
        value: 10
      - key: REQUEST_TIMEOUT
        value: 30
      - key: MODEL_NAME
        value: mock-model
      - key: ENABLE_WHISPER
        value: false
      - key: DEMO_MODE
        value: true
    healthCheckPath: /api/live