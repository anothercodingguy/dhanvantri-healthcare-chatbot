services:
  # Main Dhanvantri application
  - type: web
    name: dhanvantri-app
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile.render
    envVars:
      - key: OLLAMA_BASE
        value: https://api.replicate.com/v1/models
      - key: WHISPER_BASE
        value: http://localhost:5001
      - key: LOG_LEVEL
        value: INFO
      - key: ENABLE_PRODUCTION_FEATURES
        value: false
      - key: MAX_CONCURRENT_REQUESTS
        value: 10
      - key: REQUEST_TIMEOUT
        value: 30
      - key: MODEL_NAME
        value: alibayram/medgemma:4b
      - key: ENABLE_WHISPER
        value: false
    healthCheckPath: /api/health